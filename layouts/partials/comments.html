<!-- Componente Estático de Captura In-line (Desacoplado) -->
<div class="newsletter-container" style="margin-top: 4em; margin-bottom: 2em; padding: 2.5em; background: var(--entry); border-left: 4px solid var(--link-color); border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">

    <!-- O Endpoint Limpo do ConvertKit -->

    <p style="font-size: 0.8em; color: var(--secondary); margin-top: 1.5em; opacity: 0.8;">Governança total dos seus dados. Zero spam. Unsubscribe em um clique.</p>
</div>

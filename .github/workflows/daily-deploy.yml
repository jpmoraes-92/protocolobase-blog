name: Deploy Matinal Automatizado (CRON)

on:
  schedule:
    # Desloca o disparo para 07:13 (BRT) / 10:13 (UTC) para evitar o gargalo global
    - cron: '13 10 * * *'
  workflow_dispatch:

jobs:
  trigger-build:
    name: Aciona API da Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Dispara o Webhook de Deploy
        run: |
          curl -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"